<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            padding: 40px;
            width: 100%;
            max-width: 420px;
        }
        h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 24px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 14px;
            color: #555;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            color: #333;
        }
        input[readonly] {
            background: #f5f5f5;
            color: #888;
        }
        input:focus {
            outline: none;
            border-color: #4a90e2;
        }
        .btn {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            cursor: pointer;
            margin-top: 8px;
        }
        .btn-primary {
            background: #4a90e2;
            color: #fff;
        }
        .btn-primary:hover { background: #357abd; }
        .btn-secondary {
            background: #fff;
            color: #4a90e2;
            border: 1px solid #4a90e2;
        }
        .btn-secondary:hover { background: #f0f6ff; }
        .btn-danger {
            background: #e74c3c;
            color: #fff;
        }
        .btn-danger:hover { background: #c0392b; }
        .link-area {
            text-align: center;
            margin-top: 16px;
        }
        .link-area a {
            color: #4a90e2;
            text-decoration: none;
            font-size: 14px;
        }
        .link-area a:hover { text-decoration: underline; }
        .message {
            padding: 10px 12px;
            border-radius: 4px;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
        }
        .message.error { background: #fdecea; color: #e74c3c; }
        .message.success { background: #eafaf1; color: #27ae60; }
        .sso-section {
            margin-top: 24px;
            border-top: 1px solid #eee;
            padding-top: 20px;
            display: none;
        }
        .sso-section h2 {
            font-size: 16px;
            color: #555;
            margin-bottom: 12px;
        }
        .sso-list {
            list-style: none;
        }
        .sso-list li {
            margin-bottom: 8px;
        }
        .sso-list a {
            display: block;
            padding: 10px 14px;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 4px;
            color: #333;
            text-decoration: none;
            font-size: 14px;
        }
        .sso-list a:hover { background: #e9ecef; }
        .sso-list .app-desc {
            font-size: 12px;
            color: #888;
            margin-top: 2px;
        }
        #loggedInSection { display: none; }
    </style>
</head>
<body>
<div class="container">
    <h1>認証サービス</h1>
    <div id="message" class="message"></div>

    <!-- ログイン前 -->
    <div id="loginSection">
        <div class="form-group">
            <label for="personId">Person ID</label>
            <input type="text" id="personId" placeholder="Person IDを入力">
        </div>
        <div class="form-group">
            <label for="password">パスワード</label>
            <input type="password" id="password" placeholder="パスワードを入力">
        </div>
        <button class="btn btn-primary" onclick="login()">ログイン</button>
        <button class="btn btn-secondary" onclick="goToRegister()">登録情報変更</button>
        <div class="link-area">
            <a href="register.html">新規ユーザー登録</a>
        </div>
    </div>

    <!-- ログイン後 -->
    <div id="loggedInSection">
        <div class="form-group">
            <label>Person ID</label>
            <input type="text" id="personIdDisplay" readonly>
        </div>
        <div class="form-group">
            <label>パスワード</label>
            <input type="password" id="passwordDisplay" value="********" readonly>
        </div>
        <button class="btn btn-secondary" onclick="goToRegister()">登録情報変更</button>
        <button class="btn btn-danger" onclick="logout()">ログアウト</button>

        <!-- SSOアプリ一覧 -->
        <div class="sso-section" id="ssoSection">
            <h2>利用可能なアプリ</h2>
            <ul class="sso-list" id="ssoList"></ul>
        </div>
    </div>
</div>

<script>
    const API_BASE = '/api';

    // ページ読み込み時にログイン状態を確認
    window.onload = async () => {
        const res = await fetch(`${API_BASE}/auth/status`, { credentials: 'include' });
        const data = await res.json();
        if (data.loggedIn) {
            showLoggedIn(data.personId);
            loadSsoApps();
        }
    };

    // ログイン
    async function login() {
        const personId = document.getElementById('personId').value.trim();
        const password = document.getElementById('password').value;

        if (!personId || !password) {
            showMessage('Person IDとパスワードを入力してください', 'error');
            return;
        }

        const res = await fetch(`${API_BASE}/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ personId, password })
        });

        const data = await res.json();
        if (res.ok) {
            showLoggedIn(data.personId);
            renderSsoApps(data.ssoApps);
        } else {
            showMessage(data.message || '認証に失敗しました', 'error');
        }
    }

    // ログアウト
    async function logout() {
        await fetch(`${API_BASE}/auth/logout`, {
            method: 'POST',
            credentials: 'include'
        });
        showLoggedOut();
        showMessage('ログアウトしました', 'success');
    }

    // SSOアプリ一覧を取得
    async function loadSsoApps() {
        const res = await fetch(`${API_BASE}/auth/sso-apps`, { credentials: 'include' });
        const data = await res.json();
        if (data.ssoApps) renderSsoApps(data.ssoApps);
    }

    // SSOアプリ一覧を描画
    function renderSsoApps(apps) {
        if (!apps || apps.length === 0) return;
        const list = document.getElementById('ssoList');
        list.innerHTML = '';
        apps.forEach(app => {
            const li = document.createElement('li');
            li.innerHTML = `
                <a href="${app.appUrl}" target="_blank">
                    ${app.appName}
                    <div class="app-desc">${app.description}</div>
                </a>`;
            list.appendChild(li);
        });
        document.getElementById('ssoSection').style.display = 'block';
    }

    // 登録・変更画面へ
    function goToRegister() {
        const personId = document.getElementById('personId').value.trim() ||
                         document.getElementById('personIdDisplay').value.trim();
        const password = document.getElementById('password').value;
        const params = new URLSearchParams({ personId, password });
        window.location.href = `register.html?${params.toString()}`;
    }

    // ログイン後の表示
    function showLoggedIn(personId) {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('loggedInSection').style.display = 'block';
        document.getElementById('personIdDisplay').value = personId;
    }

    // ログアウト後の表示
    function showLoggedOut() {
        document.getElementById('loginSection').style.display = 'block';
        document.getElementById('loggedInSection').style.display = 'none';
        document.getElementById('ssoSection').style.display = 'none';
        document.getElementById('personId').value = '';
        document.getElementById('password').value = '';
    }

    // メッセージ表示
    function showMessage(msg, type) {
        const el = document.getElementById('message');
        el.textContent = msg;
        el.className = `message ${type}`;
        el.style.display = 'block';
        setTimeout(() => el.style.display = 'none', 4000);
    }
</script>
</body>
</html>
