# ===========================
# Oracle ATP 接続設定
# ===========================
spring.datasource.url=jdbc:oracle:thin:@adb23aiyy1_tp?TNS_ADMIN=src/main/resources/wallet
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ===========================
# コネクションプール（HikariCP）
# ===========================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ===========================
# JPA / Hibernate設定
# ===========================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===========================
# メール設定（OCI Email Delivery）
# ===========================
spring.mail.host=smtp.email.ap-osaka-1.oci.oraclecloud.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# 送信元メールアドレス
app.mail.from=${MAIL_FROM}
# 本登録URLのベース
app.registration.base-url=http://localhost:8080
